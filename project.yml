# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Su Mac:  brew install xcodegen  &&  xcodegen generate
name: LyricsApple
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: it

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  # SDK ufficiale Spotify: usato solo per il login tramite l'app Spotify.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1

targets:
  LyricsApple:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: SpotifyiOS
      - target: LyricsWidgets
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: LyricsApple
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        # Permette di capire se l'app Spotify è installata.
        LSApplicationQueriesSchemes:
          - spotify
        # L'app Spotify ci riapre con lyricsapple://spotify-callback dopo il consenso.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).spotify-auth
            CFBundleURLSchemes:
              - lyricsapple
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Live Activity: testo su schermata di blocco, Dynamic Island e CarPlay.
        NSSupportsLiveActivities: true
        # Audio silenzioso in background: tiene viva l'app (e la Live Activity) a schermo bloccato.
        UIBackgroundModes:
          - audio
        # App Group per passare il testo al widget (nome di riserva: di solito lo legge dal profilo).
        LyricsAppGroup: group.$(APP_BUNDLE_ID)
    entitlements:
      path: App/LyricsApple.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)

  LyricsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LyricsAppGroup: group.$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/LyricsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)

  LyricsAppleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LyricsApple

schemes:
  LyricsApple:
    build:
      targets:
        LyricsApple: all
        LyricsAppleTests: [test]
    test:
      targets:
        - LyricsAppleTests
