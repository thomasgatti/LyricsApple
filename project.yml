# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Su Mac:  brew install xcodegen  &&  xcodegen generate
name: LyricsApple
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  LyricsApple:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: LyricsApple
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark

  LyricsAppleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LyricsApple

schemes:
  LyricsApple:
    build:
      targets:
        LyricsApple: all
        LyricsAppleTests: [test]
    test:
      targets:
        - LyricsAppleTests
