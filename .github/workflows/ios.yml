# Compila l'app ed esegue i test su un Mac di GitHub (gratis per repository pubblici,
# minuti inclusi per quelli privati). Utile per verificare il codice senza avere un Mac.
name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Prepara configurazione
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Compila ed esegui i test
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if 'iPhone' in d['name']))
          ")
          echo "Simulatore: $UDID"
          xcodebuild test \
            -project LyricsApple.xcodeproj \
            -scheme LyricsApple \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
